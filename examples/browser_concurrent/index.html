<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Hike Concurrency on Browser (WASM)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background: #0f172a;
            color: #f8fafc;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 2rem;
            width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.3rem; }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            background: #334155;
            display: inline-block;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .box {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }
        .box-title { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .box-value { font-size: 1.8rem; font-weight: bold; color: #4ade80; }
        
        .config-group {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .config-label { font-size: 0.9rem; color: #cbd5e1; }
        .config-input {
            width: 100px;
            padding: 0.4rem 0.6rem;
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: right;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #log {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #cbd5e1;
            font-family: Consolas, monospace;
            background: #020617;
            padding: 0.75rem;
            border-radius: 6px;
            max-height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Hike Concurrency Engine</h2>
    <div id="status" class="status">待機中</div>

    <div class="config-group">
        <span class="config-label">WASM 許可ヒープ容量 (KB):</span>
        <input type="number" id="heap-size-input" class="config-input" value="64" min="16" max="4096" step="16">
    </div>

    <div class="results">
        <div class="box">
            <div class="box-title">SUM (15 + 3)</div>
            <div id="val-sum" class="box-value">-</div>
        </div>
        <div class="box">
            <div class="box-title">MUL (15 * 3)</div>
            <div id="val-mul" class="box-value">-</div>
        </div>
    </div>

    <button id="run-btn" onclick="startExecution()">並行計算を実行</button>

    <div id="log"></div>
</div>

<!-- runtime.js のみを読み込み -->
<script src="runtime.js"></script>

<script>
    const statusEl = document.getElementById('status');
    const sumEl = document.getElementById('val-sum');
    const mulEl = document.getElementById('val-mul');
    const logEl = document.getElementById('log');
    const runBtn = document.getElementById('run-btn');
    const heapInput = document.getElementById('heap-size-input');

    function log(msg) {
        logEl.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    // runtime.js 自体を Worker スクリプトとして起動する統合ランタイム
    const runtime = new HikeConcurrentRuntime({
        wasmUrl: 'main.wasm',
        scriptUrl: 'runtime.js',
        heapSizeKB: Number(heapInput.value),
        onResult: (sum, mul) => {
            sumEl.innerText = sum;
            mulEl.innerText = mul;
            statusEl.innerText = "計算完了 (Success)";
            statusEl.style.background = "#15803d";
            log(`結果受信: SUM=${sum}, MUL=${mul}`);
            runBtn.disabled = false;
        },
        onLog: (msg) => {
            log(msg);
        }
    });

    // 外部API (setHikeHeapSizeKB) の呼び出し
    heapInput.addEventListener('change', () => {
        const kb = Number(heapInput.value);
        window.setHikeHeapSizeKB(kb);
        log(`外部APIよりヒープサイズを変更: ${kb} KB`);
    });

    async function startExecution() {
        runBtn.disabled = true;
        statusEl.innerText = "スレッドプールで計算中...";
        statusEl.style.background = "#0369a1";
        sumEl.innerText = "-";
        mulEl.innerText = "-";

        runtime.setHeapSizeKB(Number(heapInput.value));

        try {
            await runtime.start();
        } catch (err) {
            log("実行エラー: " + err);
            statusEl.innerText = "エラー";
            statusEl.style.background = "#b91c1c";
            runBtn.disabled = false;
        }
    }
</script>

</body>
</html>
